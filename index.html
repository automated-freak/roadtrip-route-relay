<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Route Relay</title>
  <meta name="description" content="Shared turn-by-turn route handoff for road trips." />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: var(--panel);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 22px; font-size: 16px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .links a {
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Planning phase</span>
    <h1>Route Relay</h1>
    <p>
      Shared turn-by-turn route handoff for road trips. Passengers suggest Google Maps or
      Apple Maps routes; the driver switches navigation with one tap.
    </p>
    <p>This is a placeholder page — the app is not built yet.</p>
    <div class="links">
      <a href="https://github.com/automated-freak/roadtrip-route-relay">Repository</a>
      <a href="https://github.com/automated-freak/roadtrip-route-relay/blob/main/docs/PLAN.md">Build plan</a>
      <a href="https://github.com/automated-freak/roadtrip-route-relay/blob/main/docs/ARCHITECTURE.md">Architecture</a>
    </div>
  </div>
</body>
</html>
