<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif">
  <!-- background -->
  <rect width="400" height="800" fill="#eef0f4"/>

  <!-- phone frame -->
  <rect x="32" y="16" width="336" height="768" rx="42" fill="#ffffff" stroke="#c8ccd4" stroke-width="2"/>

  <!-- status bar -->
  <text x="60" y="48" font-size="13" fill="#333">9:41</text>
  <rect x="300" y="38" width="46" height="14" rx="7" fill="#d8dbe0"/>
  <line x1="32" y1="64" x2="368" y2="64" stroke="#e4e6ea" stroke-width="1"/>

  <!-- header -->
  <text x="52" y="100" font-size="24" font-weight="700" fill="#111">Route Relay</text>
  <text x="52" y="122" font-size="13" fill="#888">Road-trip navigation handoff</text>

  <!-- section: trip code -->
  <text x="52" y="166" font-size="11" font-weight="600" letter-spacing="1" fill="#999">TRIP CODE</text>
  <rect x="52" y="178" width="230" height="54" rx="12" fill="#f2f3f6" stroke="#d8dbe0"/>
  <text x="70" y="212" font-size="26" font-weight="700" letter-spacing="6" fill="#111">X7K2Q</text>
  <rect x="294" y="178" width="66" height="54" rx="12" fill="#1b1f27"/>
  <text x="327" y="211" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">New</text>
  <text x="52" y="250" font-size="11" fill="#b23">^ tap to generate a new unguessable code (CSPRNG)</text>

  <!-- section: role -->
  <text x="52" y="300" font-size="11" font-weight="600" letter-spacing="1" fill="#999">I AM…</text>
  <rect x="52" y="312" width="145" height="62" rx="12" fill="#1b1f27"/>
  <text x="124" y="349" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">🚗 Driving</text>
  <rect x="207" y="312" width="153" height="62" rx="12" fill="#f2f3f6" stroke="#d8dbe0"/>
  <text x="283" y="349" font-size="16" font-weight="500" fill="#333" text-anchor="middle">🧍 Riding</text>
  <text x="52" y="394" font-size="11" fill="#b23">^ self-selected, not an account. Picks which view opens.</text>

  <!-- section: nickname -->
  <text x="52" y="444" font-size="11" font-weight="600" letter-spacing="1" fill="#999">NICKNAME (OPTIONAL)</text>
  <rect x="52" y="456" width="308" height="50" rx="12" fill="#f2f3f6" stroke="#d8dbe0"/>
  <text x="70" y="486" font-size="15" fill="#aaa">Sam</text>

  <!-- primary action -->
  <rect x="52" y="540" width="308" height="58" rx="14" fill="#0a84ff"/>
  <text x="206" y="576" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">Join trip</text>

  <!-- divider -->
  <line x1="52" y1="628" x2="348" y2="628" stroke="#e4e6ea"/>
  <text x="200" y="650" font-size="11" fill="#999" text-anchor="middle">— or join with a shared link —</text>
  <text x="200" y="670" font-size="12" fill="#888" text-anchor="middle">Paste the trip URL and the code fills in automatically</text>

  <!-- footnote -->
  <text x="200" y="740" font-size="11" fill="#aaa" text-anchor="middle">No account · the code is the key</text>
</svg>
